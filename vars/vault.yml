---
# Ansible Vault - Encrypted Credentials
# Encrypt this file: ansible-vault encrypt vars/vault.yml
# Edit encrypted:    ansible-vault edit vars/vault.yml
# View encrypted:    ansible-vault view vars/vault.yml
#
# To run playbooks with vault:
#   ansible-playbook site.yml --ask-vault-pass
#   ansible-playbook site.yml --vault-password-file ~/.vault_pass

# ============================================================================
# Hammerspace API Credentials
# ============================================================================
# vault_hammerspace_api_password: "PASSWORD"

# ============================================================================
# sudo (become) password on the Tier 0 / DI hosts
# ============================================================================
# Only needed when the SSH user must type a password for sudo (no NOPASSWD).
# Fact gathering needs sudo BEFORE the plays load this file, so it must be
# passed as extra vars, e.g.:
#   ansible-playbook site.yml -e @vars/vault.yml \
#     -e 'ansible_become_password={{ vault_become_password }}'
# or simply prompt for it with -K. The GUI's run pages do this for you
# ("Use the saved sudo password").
# vault_become_password: "SUDO_PASSWORD"

# ============================================================================
# Active Directory Credentials (uncomment if using AD join)
# ============================================================================
# vault_ad_username: "admin@corp.example.com"
# vault_ad_password: "changeme"

# ============================================================================
# S3 Storage Credentials (uncomment if using S3 integration)
# ============================================================================
# vault_s3_access_key: "AKIAIOSFODNN7EXAMPLE"
# vault_s3_secret_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"

# ============================================================================
# S3 User Credentials (uncomment if creating S3 users)
# ============================================================================
# vault_s3_user_access_key: "AKIAIOSFODNN7EXAMPLE"
# vault_s3_user_secret_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
